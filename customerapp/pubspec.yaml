name: freshkart_customer
description: "FreshKart Customer App - Grocery delivery and home services"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: '>=2.5.1 <3.0.0'
  state_notifier: ^1.0.0
  go_router: ^17.1.0
  supabase_flutter: ^2.12.0
  dio: ^5.4.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10
  google_fonts: ^8.0.2
  geolocator: ^11.0.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.2.0
  razorpay_flutter: ^1.3.6
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.1.2
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  timeago: ^3.7.0
  intl: ^0.20.2
  url_launcher: ^6.2.6
  lottie: ^3.1.0
  confetti: ^0.7.0
  fl_chart: ^1.2.0
  pinput: ^5.0.0
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  share_plus: ^10.1.4
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/
