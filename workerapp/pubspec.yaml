name: freshkart_worker
description: FreshKart worker app for home service professionals
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  supabase_flutter: ^2.3.0
  dio: ^5.4.1
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.1.2
  geolocator: ^11.0.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  timeago: ^3.6.1
  intl: ^0.20.2
  lottie: ^3.1.0
  audioplayers: ^6.0.0
  wakelock_plus: ^1.2.5
  vibration: ^2.0.0
  url_launcher: ^6.3.0
  pinput: ^5.0.0
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  connectivity_plus: ^6.0.3
  image_picker: ^1.1.2
  flutter_image_compress: ^2.2.0
  file_picker: ^8.0.3
  signature: ^5.4.0
  local_auth: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/audio/
